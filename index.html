<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>АКЧМ | АҚМК — Капсула времени</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 5%,#ed7c22 0%,#a94214 34%,#451c14 75%,#24130e);color:#fff1dc;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:28px}main{max-width:960px;width:100%;text-align:center}.top{display:flex;justify-content:flex-end}.switch{border:1px solid #ffb66d;background:#3a180fb9;border-radius:30px;padding:5px}.switch button{border:0;border-radius:24px;background:none;color:#ffcd9d;padding:10px 17px;cursor:pointer}.switch button.active{background:#ff922d;color:#321408;font-weight:bold}h1{font-size:clamp(42px,8vw,82px);letter-spacing:.05em;margin:25px 0 6px;color:#ffb34e}h2{font-weight:400;letter-spacing:.15em;color:#ffb34e;font-size:clamp(17px,3vw,25px);margin:0}.intro{font-size:clamp(18px,3vw,24px);line-height:1.6;margin:26px 0 34px}.timer{border:1px solid #ff9d39;border-radius:25px;background:#32170cbb;padding:30px 20px;box-shadow:0 20px 65px #2d0d0a80}.timer-title{font-size:20px;color:#ffc17e}.units{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px}.unit{border-right:1px solid #c57940}.unit:last-child{border:0}.number{display:block;font-size:clamp(34px,8vw,80px);font-weight:700;color:#ffa536;text-shadow:0 0 26px #f5723166}.unit-label{font-size:clamp(11px,2vw,17px);letter-spacing:.07em}.message{font-size:clamp(19px,3vw,25px);line-height:1.5;margin:38px 0}.dates{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;background:#34180eab;border:1px solid #e6873e;border-radius:18px;padding:23px}.dates div{min-width:220px}.dates strong{display:block;color:#ffb24e;font-size:25px;margin-top:8px}footer{opacity:.8;margin-top:25px;font-size:14px}@media(max-width:450px){body{padding:15px}.timer{padding:23px 8px}.units{gap:2px}.unit-label{letter-spacing:0}}
</style></head><body><main><div class="top"><div class="switch"><button id="kk" onclick="setLang('kk')">ҚАЗ</button><button id="ru" onclick="setLang('ru')">РУС</button></div></div><h1>АКЧМ | АҚМК</h1><h2 id="heading">КАПСУЛА ВРЕМЕНИ</h2><p class="intro" id="intro">Сегодняшние воспоминания — завтрашним нам.</p><section class="timer"><div class="timer-title" id="countTitle">ДО ОТКРЫТИЯ ОСТАЛОСЬ</div><div class="units"><div class="unit"><span class="number" id="days">—</span><span class="unit-label" id="daysLabel">ДНЕЙ</span></div><div class="unit"><span class="number" id="hours">—</span><span class="unit-label" id="hoursLabel">ЧАСОВ</span></div><div class="unit"><span class="number" id="minutes">—</span><span class="unit-label" id="minutesLabel">МИНУТ</span></div><div class="unit"><span class="number" id="seconds">—</span><span class="unit-label" id="secondsLabel">СЕКУНД</span></div></div></section><p class="message" id="message">Через пять лет эти воспоминания снова оживут.</p><section class="dates"><div><span id="sealed">ДАТА ЗАКЛАДКИ</span><strong>02.10.2026</strong></div><div><span id="opened">ДАТА ОТКРЫТИЯ</span><strong>02.10.2031</strong></div></section><footer>АКЧМ · АҚМК ✦ 2026—2031</footer></main><script>
const translations={ru:{heading:'КАПСУЛА ВРЕМЕНИ',intro:'Сегодняшние воспоминания — завтрашним нам.',countTitle:'ДО ОТКРЫТИЯ ОСТАЛОСЬ',daysLabel:'ДНЕЙ',hoursLabel:'ЧАСОВ',minutesLabel:'МИНУТ',secondsLabel:'СЕКУНД',message:'Через пять лет эти воспоминания снова оживут.',ready:'Время пришло! Откройте капсулу времени!',sealed:'ДАТА ЗАКЛАДКИ',opened:'ДАТА ОТКРЫТИЯ'},kk:{heading:'УАҚЫТ КАПСУЛАСЫ',intro:'Бүгінгі естеліктер — ертеңгі бізге.',countTitle:'АШУҒА ҚАЛДЫ',daysLabel:'КҮН',hoursLabel:'САҒАТ',minutesLabel:'МИНУТ',secondsLabel:'СЕКУНД',message:'Бес жылдан кейін бұл естеліктер қайта жаңғырады.',ready:'Уақыт келді! Уақыт капсуласын ашыңдар!',sealed:'САЛЫНҒАН КҮНІ',opened:'АШЫЛАТЫН КҮНІ'}};let lang='kk';const target=Date.parse('2031-10-02T00:00:00+05:00');function setLang(l){lang=l;document.documentElement.lang=l;for(const [k,v] of Object.entries(translations[l]))if(k!=='ready')document.getElementById(k).textContent=v;document.getElementById('kk').classList.toggle('active',l==='kk');document.getElementById('ru').classList.toggle('active',l==='ru');tick()}function tick(){let t=Math.max(0,Math.floor((target-Date.now())/1000));for(const [id,val] of Object.entries({days:Math.floor(t/86400),hours:Math.floor(t%86400/3600),minutes:Math.floor(t%3600/60),seconds:t%60}))document.getElementById(id).textContent=String(val).padStart(2,'0');if(Date.now()>=target)document.getElementById('message').textContent=translations[lang].ready}setLang('kk');setInterval(tick,1000);
</script></body></html>
